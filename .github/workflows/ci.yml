name: Test local SATB workstation

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install local score renderer
        run: npm install --no-audit --no-fund
      - name: Install system video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2 libpango-1.0-0 libgdk-pixbuf-2.0-0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install local Chromium for real video export
        run: python -m playwright install --with-deps chromium
      - name: Verify video toolchain
        run: |
          python - <<'PY'
          from app.video import video_dependencies
          deps = video_dependencies()
          print(deps)
          missing = [name for name, available in deps.items() if not available]
          if missing:
              raise SystemExit("Missing video dependencies: " + ", ".join(missing))
          PY
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run unit and end-to-end tests
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
